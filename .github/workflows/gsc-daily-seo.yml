name: Daily GSC & Gemini SEO Optimizer

on:
  schedule:
    # Runs every day at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows one-click manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  seo-optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Fetch & Filter Google Search Console Data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: 'https://www.driveitcars.in/'
          GSC_SITEMAP_URL: 'https://www.driveitcars.in/sitemap.xml'
        run: node scripts/gsc-cron.mjs

      - name: 2. Run Gemini AI SEO Optimizer & Neon PostgreSQL Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/gsc-gemini-optimizer.mjs

      - name: 3. Daily Rank Tracker, Keyword Discovery & Telegram Dispatch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/track-local-rankings.mjs

      - name: 4. Commit & Push Updated Reports
        run: |
          git config --global user.name "DriveItCars SEO Bot"
          git config --global user.email "bot@driveitcars.in"
          git add reports/
          git diff --staged --quiet || git commit -m "chore(seo): automated daily GSC & Gemini SEO audit [skip ci]"
          git push
